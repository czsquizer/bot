# Fusiora fork: builds the bot image on every push to the "fusiora" branch
# and publishes it to GitHub Container Registry as ghcr.io/<owner>/<repo>:fusiora
#
# Differences from upstream docker.yml:
#   - Docker Hub login and the eartharoid/discord-tickets image removed (the fork has no Docker Hub secrets,
#     the upstream workflow would fail on that step)
#   - only linux/amd64 is built (no QEMU, much faster)
#   - triggers on the "fusiora" branch and manually (workflow_dispatch)
#   - action versions bumped to current majors

name: Publish Docker image

on:
  push:
    branches:
      - 'fusiora'
  workflow_dispatch:

jobs:
  push_to_ghcr:
    name: Build and push image to GHCR
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
